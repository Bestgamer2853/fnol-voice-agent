<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f0e8" />
    <meta name="description" content="A keyboard-first, offline-capable interview cockpit for the Meridian FNOL Voice Agent." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <title>FNOL / Interview Cockpit</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to answer</a>
    <div class="app-shell">
      <aside class="rail" id="rail" aria-label="Interview cockpit navigation">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">M</span>
          <div>
            <p class="eyebrow">Meridian / FNOL</p>
            <p class="brand-name">Interview cockpit</p>
          </div>
        </div>

        <button class="command-trigger" id="command-trigger" type="button" aria-haspopup="dialog">
          <span>Search the system</span><kbd>⌘ K</kbd>
        </button>

        <nav class="rail-nav" id="rail-nav" aria-label="Primary"></nav>
        <div class="rail-footer">
          <p><span class="status-dot"></span>Repository-grounded</p>
          <button class="quiet-button" id="install-button" type="button" hidden>Install offline app</button>
          <p class="shortcut-hint"><kbd>/</kbd> search · <kbd>?</kbd> shortcuts</p>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <button class="menu-button" id="menu-button" type="button" aria-label="Open navigation">Menu</button>
          <p id="crumbs" class="crumbs">Cockpit / Briefing</p>
          <div class="topbar-actions">
            <button class="text-button" id="shortcuts-button" type="button">Shortcuts <kbd>?</kbd></button>
            <button class="panic-button" data-route="panic" type="button">Panic mode</button>
          </div>
        </header>
        <main id="main" class="main" tabindex="-1"></main>
      </div>
    </div>

    <div class="palette-backdrop" id="palette-backdrop" hidden></div>
    <section class="command-palette" id="command-palette" role="dialog" aria-modal="true" aria-label="Search the interview cockpit" hidden>
      <div class="palette-input-wrap">
        <span aria-hidden="true">⌕</span>
        <input id="palette-input" type="search" autocomplete="off" placeholder="Ask about a file, method, concept, or interview question…" />
        <kbd>Esc</kbd>
      </div>
      <div class="palette-results" id="palette-results" role="listbox"></div>
      <p class="palette-help"><kbd>↑</kbd><kbd>↓</kbd> move <kbd>↵</kbd> open <kbd>⌘ K</kbd> close</p>
    </section>

    <template id="toast-template"><div class="toast" role="status"></div></template>
    <script src="app.js" defer></script>
  </body>
</html>
